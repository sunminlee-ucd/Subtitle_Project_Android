name: Align Study clear-selection behavior

on:
  push:
    branches:
      - agent/port-web-study-mode

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/port-web-study-mode

      - name: Match web Clear selection behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('SubtitleOverlayAndroid/app/src/main/java/com/sun/subtitleoverlay/overlay/OverlayService.kt')
          lines = path.read_text().splitlines(keepends=True)
          function_index = next(
              (index for index, line in enumerate(lines) if 'private fun clearStudySelection()' in line),
              None,
          )
          if function_index is None:
              raise SystemExit('clearStudySelection function was not found')

          target = 'stopStudyRepeat(pause = false, userInitiated = false)'
          for index in range(function_index, min(function_index + 12, len(lines))):
              if target in lines[index]:
                  del lines[index]
                  path.write_text(''.join(lines))
                  break
          else:
              raise SystemExit('Expected stopStudyRepeat line was not found inside clearStudySelection')
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SubtitleOverlayAndroid/app/src/main/java/com/sun/subtitleoverlay/overlay/OverlayService.kt
          git diff --cached --quiet && exit 0
          git commit -m "Match web Study clear-selection behavior"
          git push origin HEAD:agent/port-web-study-mode
