name: Verify release signing

on:
  push:
    branches:
      - agent/stable-release-signing

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SubtitleOverlayAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/ci-release.jks"
          keytool -genkeypair -noprompt \
            -storetype JKS \
            -keystore "$KEYSTORE_PATH" \
            -storepass "ci-store-password" \
            -keypass "ci-key-password" \
            -alias "ci-release" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1000 \
            -dname "CN=Subtitle Overlay CI, OU=CI, O=Subtitle Overlay, L=Dublin, C=IE"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=ci-store-password"
            echo "ANDROID_KEY_ALIAS=ci-release"
            echo "ANDROID_KEY_PASSWORD=ci-key-password"
            echo "ANDROID_VERSION_CODE=1999"
            echo "ANDROID_VERSION_NAME=0.0.0-ci"
            echo "REQUIRE_RELEASE_SIGNING=true"
          } >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
