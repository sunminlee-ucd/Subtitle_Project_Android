name: Android CI

on:
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - 'APK/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SubtitleOverlayAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply subtitle gesture patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: .
        run: python .github/gesture-multisub-patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK filename
        run: |
          test -f app/build/outputs/apk/debug/subtitle-companion.apk
          test ! -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload subtitle-companion APK
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-companion-debug
          path: SubtitleOverlayAndroid/app/build/outputs/apk/debug/subtitle-companion.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish source and APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: .
        run: |
          mkdir -p APK
          cp SubtitleOverlayAndroid/app/build/outputs/apk/debug/subtitle-companion.apk APK/subtitle-companion.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SubtitleOverlayAndroid/app/src/main/java/com/sun/subtitleoverlay/MainActivity.kt
          git add SubtitleOverlayAndroid/app/src/main/java/com/sun/subtitleoverlay/overlay/OverlayService.kt
          git add -f APK/subtitle-companion.apk
          if git diff --cached --quiet; then
            echo "Source and APK are already up to date."
            exit 0
          fi
          git commit -m "Add multi subtitle entry and touch gestures"
          git push origin HEAD:master
