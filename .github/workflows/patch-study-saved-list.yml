name: Wire Study saved list

on:
  push:
    branches:
      - agent/study-saved-list

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/study-saved-list

      - name: Add Saved list control
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('SubtitleOverlayAndroid/app/src/main/java/com/sun/subtitleoverlay/overlay/OverlayService.kt')
          text = path.read_text()

          import_anchor = 'import com.sun.subtitleoverlay.study.StudyPlaybackEngine\n'
          import_line = 'import com.sun.subtitleoverlay.study.StudySavedCuesActivity\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('StudyPlaybackEngine import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          button_anchor = '        actionRow.addView(chip("Stop", widthDp = 44, textSizeSp = 9f, description = "Stop study repetition") {'
          button = '''        actionRow.addView(chip("Saved list", widthDp = 60, textSizeSp = 9f, description = "Search saved study subtitles") {
              openStudySavedCues()
          })
'''
          if 'description = "Search saved study subtitles"' not in text:
              if button_anchor not in text:
                  raise SystemExit('Study action-row anchor not found')
              text = text.replace(button_anchor, button + button_anchor, 1)

          helper_anchor = '    private fun hasControllableStudyPlayback(): Boolean {'
          helper = '''    private fun openStudySavedCues() {
        startActivity(
            Intent(this, StudySavedCuesActivity::class.java)
                .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
        )
    }

'''
          if 'private fun openStudySavedCues()' not in text:
              if helper_anchor not in text:
                  raise SystemExit('Study helper anchor not found')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SubtitleOverlayAndroid/app/src/main/java/com/sun/subtitleoverlay/overlay/OverlayService.kt
          git diff --cached --quiet && exit 0
          git commit -m "Open searchable Study saved list from overlay"
          git push origin HEAD:agent/study-saved-list
