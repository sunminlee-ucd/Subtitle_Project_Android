name: Build OTT UI test APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify-build-store:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SubtitleOverlayAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      - name: Test and lint
        run: |
          chmod +x gradlew
          ./gradlew test lint --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Commit latest APK to master
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f SubtitleOverlayAndroid/app/build/outputs/apk/debug/app-debug.apk
          if git diff --cached --quiet; then
            echo "APK already matches the latest source build."
          else
            git commit -m "Update APK with OTT subtitle library UI"
            git push origin HEAD:master
          fi

# Manual trigger marker: OTT library UI verification.
