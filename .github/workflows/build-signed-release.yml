name: Build signed release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Public version name, for example 0.3.0
        required: true
        default: "0.3.0"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SubtitleOverlayAndroid
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      REQUESTED_VERSION_NAME: ${{ inputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      - name: Validate signing secrets and version
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          if [[ ! "$REQUESTED_VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version_name: $REQUESTED_VERSION_NAME" >&2
            exit 1
          fi

      - name: Prepare signing key and build version
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/subtitle-overlay-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_VERSION_CODE=$VERSION_CODE"
            echo "ANDROID_VERSION_NAME=$REQUESTED_VERSION_NAME"
            echo "REQUIRE_RELEASE_SIGNING=true"
          } >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in the Android SDK." >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare distributable artifact
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="app/build/outputs/apk/release/app-release.apk"
          OUTPUT="SubtitleOverlay-${ANDROID_VERSION_NAME}-${ANDROID_VERSION_CODE}-signed.apk"
          cp "$SOURCE" "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-overlay-${{ inputs.version_name }}-signed
          path: |
            SubtitleOverlayAndroid/SubtitleOverlay-*-signed.apk
            SubtitleOverlayAndroid/SubtitleOverlay-*-signed.apk.sha256
          if-no-files-found: error
          retention-days: 90
