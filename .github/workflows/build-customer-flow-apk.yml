name: Build customer-flow Android APK

on:
  push:
    branches:
      - agent/customer-flow-apk

permissions:
  contents: write

jobs:
  verify-build-store:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify customer business contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('SubtitleOverlayAndroid/app/src/main/java/com/sun/subtitleoverlay/customer/CustomerSubtitleRepository.kt').read_text()
          main = Path('SubtitleOverlayAndroid/app/src/main/java/com/sun/subtitleoverlay/MainActivity.kt').read_text()
          manifest = Path('SubtitleOverlayAndroid/app/src/main/AndroidManifest.xml').read_text()

          required_repo = [
              'https://qtpxlrnazsonqdljafkd.supabase.co',
              'sb_publishable_ZIlaAn2SOwncEW11LyzUHg_hI9Wzmtg',
              '/auth/v1/token?grant_type=password',
              '/auth/v1/token?grant_type=refresh_token',
              '/rest/v1/subtitle_tracks',
              'is_active=eq.true',
              '/storage/v1/object/authenticated/subtitle-files/',
              'storage_path',
          ]
          required_main = [
              'My subtitles',
              'Start subtitle overlay',
              'repository.authorizedTracks()',
              'repository.loadAuthorizedSubtitle(track.id)',
              'ContextCompat.startForegroundService',
          ]
          missing = [item for item in required_repo if item not in repo]
          missing += [item for item in required_main if item not in main]
          if 'android.permission.INTERNET' not in manifest:
              missing.append('android.permission.INTERNET')
          if missing:
              raise SystemExit('Missing customer-flow contract: ' + ', '.join(missing))

          forbidden = ['sb_secret_', 'service_role']
          for item in forbidden:
              if item in repo.lower() or item in main.lower():
                  raise SystemExit(f'Privileged credential marker found: {item}')

          print('Customer business contract verified.')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      - name: Unit tests and lint
        working-directory: SubtitleOverlayAndroid
        run: |
          chmod +x gradlew
          ./gradlew test lint --stacktrace

      - name: Build repository debug APK
        working-directory: SubtitleOverlayAndroid
        run: ./gradlew assembleDebug --stacktrace

      - name: Preserve repository APK
        shell: bash
        run: |
          cp SubtitleOverlayAndroid/app/build/outputs/apk/debug/app-debug.apk /tmp/repository-app-debug.apk

      - name: Build side-by-side device-test APK
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('SubtitleOverlayAndroid/app/build.gradle.kts')
          text = path.read_text()
          old = '        applicationId = "com.sun.subtitleoverlay"'
          new = '        applicationId = "com.sun.subtitleoverlay.customerflowtest"'
          if old not in text:
              raise SystemExit('applicationId anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cd SubtitleOverlayAndroid
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../SubtitleOverlay-CustomerFlow-device-test.apk
          cd ..
          git checkout -- SubtitleOverlayAndroid/app/build.gradle.kts
          cp /tmp/repository-app-debug.apk SubtitleOverlayAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs SubtitleOverlayAndroid/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs SubtitleOverlay-CustomerFlow-device-test.apk
          sha256sum SubtitleOverlay-CustomerFlow-device-test.apk > SubtitleOverlay-CustomerFlow-device-test.apk.sha256

      - name: Store latest repository APK on master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f SubtitleOverlayAndroid/app/build/outputs/apk/debug/app-debug.apk
          if git diff --cached --quiet; then
            echo "Repository APK already matches latest master build."
          else
            git commit -m "Update APK with customer subtitle flow"
            git push origin HEAD:master
          fi

      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-overlay-customer-flow-device-test
          path: |
            SubtitleOverlay-CustomerFlow-device-test.apk
            SubtitleOverlay-CustomerFlow-device-test.apk.sha256
          if-no-files-found: error
          retention-days: 30
