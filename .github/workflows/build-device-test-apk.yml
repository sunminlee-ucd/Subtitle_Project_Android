name: Build Android device-test APK

on:
  push:
    branches:
      - agent/device-test-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SubtitleOverlayAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      - name: Use side-by-side test application ID
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          old = '        applicationId = "com.sun.subtitleoverlay"'
          new = '        applicationId = "com.sun.subtitleoverlay.test"'
          if old not in text:
              raise SystemExit('applicationId anchor was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare downloadable APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT="SubtitleOverlay-Android-device-test.apk"
          cp "$SOURCE" "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-overlay-android-device-test
          path: |
            SubtitleOverlayAndroid/SubtitleOverlay-Android-device-test.apk
            SubtitleOverlayAndroid/SubtitleOverlay-Android-device-test.apk.sha256
          if-no-files-found: error
          retention-days: 30
