name: Store latest debug APK in repository

on:
  push:
    branches:
      - agent/store-latest-apk

permissions:
  contents: write

jobs:
  build-and-store:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      - name: Build latest debug APK
        working-directory: SubtitleOverlayAndroid
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleDebug --stacktrace

      - name: Verify APK signature
        working-directory: SubtitleOverlayAndroid
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Commit APK to master build outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f SubtitleOverlayAndroid/app/build/outputs/apk/debug/app-debug.apk
          if git diff --cached --quiet; then
            echo "APK is already up to date."
            exit 0
          fi
          git commit -m "Update debug APK with latest Study mode build"
          git push origin HEAD:master
