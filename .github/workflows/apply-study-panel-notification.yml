name: Apply Study panel and notification UX

on:
  push:
    branches:
      - agent/study-panel-notification

permissions:
  contents: write

jobs:
  patch-test-build-store:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch patch script
        run: |
          git show origin/agent/study-panel-notification:.github/scripts/patch_study_panel_notification.py > /tmp/patch_study_panel_notification.py

      - name: Patch overlay UX
        run: python /tmp/patch_study_panel_notification.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      - name: Test and lint
        working-directory: SubtitleOverlayAndroid
        run: |
          chmod +x gradlew
          ./gradlew test lint --stacktrace

      - name: Build latest debug APK
        working-directory: SubtitleOverlayAndroid
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="SubtitleOverlayAndroid/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Commit code and latest APK to master
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SubtitleOverlayAndroid/app/src/main/java/com/sun/subtitleoverlay/overlay/OverlayService.kt
          git add -f SubtitleOverlayAndroid/app/build/outputs/apk/debug/app-debug.apk
          git commit -m "Simplify Study mode and restore panel from notification"
          git push origin HEAD:master
